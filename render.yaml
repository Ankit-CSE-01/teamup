services:
  - type: web
    name: teamup
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn teamup.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"
